# "Amnesia by Design, Memory By Necessity: Persistent State for Document
# Intelligence" (Bakkali & Merimi, arXiv:2609.32041, 25 Sep 2026).
#
# The interactive explorer at /research/persistent-state/ renders from this
# file. Tables, equations, counts and lists are transcribed from the paper.
# Prose fields are short summaries; anything that is our illustration rather
# than the paper's text is marked `illustrative: true` and labelled on screen.

id: amnesia-by-design
title: "Amnesia by Design, Memory By Necessity: Persistent State for Document Intelligence"
short_title: "Amnesia by Design, Memory by Necessity"
authors:
  - name: "Souhail Bakkali"
    affiliation: "University of Rennes, CNRS, IRISA (UMR 6074), Rennes, France"
  - name: "Ayoub Merimi"
    affiliation: "ENSA Berrechid, Hassan First University, Settat, Morocco"
arxiv: "2609.32041"
arxiv_url: "https://arxiv.org/abs/2609.32041"
html_url: "https://arxiv.org/html/2609.32041"
pdf_url: "https://arxiv.org/pdf/2609.32041"
date: "2026-09-25"
category: "cs.CV"
kind: "Survey with a formal framework, a benchmark audit and an evaluation harness"
publication_url: "/publication/2026-amnesia-by-design/"
no_results_note: "The paper is a survey and specification: it reports formal results and an audit, not experimental measurements."

quotes:
  storage: "Storage is not retrieval, and retrieval is not consolidation."
  closing: "The field has learned to read documents. It must now learn to remember them."

# The argument in four steps (our summary of the abstract and introduction).
argument:
  - title: "Document AI reads, then forgets"
    body: "Systems extract fields, reason over tables and ground answers to page regions, yet process each document as if it were the first. An amendment read the next day starts from scratch: no schema retained, no contradiction detected."
  - title: "It is a design choice, not a scale failure"
    body: "Current systems are stateless functions, y = argmax P(y | D; θ), with frozen parameters and no session index. The paper calls this the statelessness bottleneck."
  - title: "Scaling, context and retrieval do not remove it"
    body: "Storage provides persistence and retrieval provides access, but neither consolidates observations into knowledge that improves how the next document is processed."
  - title: "So the paper specifies persistent, evidence-grounded state"
    body: "It formalizes the state, its lifecycle and invariants, bounds the risk of remembering wrong things, audits ten benchmarks, and proposes a longitudinal harness with five counterfactual metrics."

counts:
  - { value: 6, label: "state components" }
  - { value: 6, label: "lifecycle operations" }
  - { value: 10, label: "benchmarks audited" }
  - { value: 8, label: "statefulness criteria" }
  - { value: 5, label: "counterfactual metrics" }
  - { value: 5, label: "unlearning levels" }

contributions:
  - "A survey of Document AI lineages, reviewed for persistence rather than capability."
  - "A formal state specification with lifecycle operations and an operator set."
  - "Theoretical bounds on contamination and Memory Harm."
  - "A statefulness audit of ten benchmarks against eight criteria."
  - "A longitudinal benchmark harness with five counterfactual metrics."

# Eq. 3: each document is a tuple.
document_tuple:
  symbol: "D = (V, T, B, G, H, M)"
  parts:
    - { key: V, name: "Visual tensors" }
    - { key: T, name: "Text tokens" }
    - { key: B, name: "Bounding boxes" }
    - { key: G, name: "Structural relation graphs" }
    - { key: H, name: "Hierarchical parse trees" }
    - { key: M, name: "Metadata" }

# Eq. 4: persistent state at session t.
state:
  symbol: "S_t = (E_t, K_t, Γ_t, 𝒱_t, P_t, A_t)"
  components:
    - key: E
      symbol: "E_t"
      name: "Episodic evidence buffer"
      role: "Admitted observations, appended with a timestamp and their provenance."
    - key: K
      symbol: "K_t"
      name: "Consolidated semantic store"
      role: "Schemas and facts abstracted from episodic traces."
    - key: G
      symbol: "Γ_t"
      name: "Associative relation graph"
      role: "Relations between entities, documents and schemas."
    - key: V
      symbol: "𝒱_t"
      name: "Temporal validity index"
      role: "When each claim holds; closed when newer evidence supersedes it."
    - key: P
      symbol: "P_t"
      name: "Provenance ledger"
      role: "Links every claim back to the document, region and version it came from."
    - key: A
      symbol: "A_t"
      name: "Authorization and policy state"
      role: "Who may read or change what; updated only by policy events."
  invariant: "Provenance is an invariant across every operation."

# Six lifecycle operations (Fig. 3).
lifecycle:
  - id: acquire
    name: "Acquire"
    body: "Extract the multimodal observation: text, layout, tables, visuals."
  - id: validate
    name: "Validate"
    body: "Gate the observation before any persistent write."
  - id: write
    name: "Write"
    body: "Append admitted evidence to the episodic store with a timestamp and provenance."
  - id: consolidate
    name: "Consolidate"
    body: "Abstract episodic traces into schemas and relations, trading expected utility against storage cost."
  - id: reconcile
    name: "Update & reconcile"
    body: "Resolve conflicts through temporal supersession and one of five outcomes."
  - id: forget
    name: "Forget"
    body: "Remove targeted information across all stores and repair dependent abstractions."

# Algorithm 1 (state transition), as a sequence of steps. `touches` lists the
# state components a step reads (r) or writes (w), following the paper's
# description of the algorithm.
algorithm:
  - id: observe
    name: "Observe"
    body: "Read the incoming document D_t as (V, T, B, G, H, M)."
    touches: {}
  - id: corroborate
    name: "Corroborate"
    body: "Check the observation against prior provenance."
    touches: { P: r, K: r }
  - id: validate
    name: "Validate"
    body: "Pre-write gate: admit the evidence or leave the state unchanged."
    touches: {}
    branch: "If the gate rejects, S_t+1 = S_t and the algorithm skips to Answer."
  - id: write
    name: "Write"
    body: "Append the admitted evidence to the episodic store and extend provenance."
    touches: { E: w, P: w }
  - id: consolidate
    name: "Consolidate"
    body: "Abstract episodic traces into schemas and relations."
    touches: { K: w, G: w }
  - id: reconcile
    name: "Reconcile"
    body: "Check against temporal validity and apply supersession."
    touches: { V: w, K: w, P: w }
  - id: authorize
    name: "Keep policy"
    body: "Authorization stays as is unless a policy event occurs."
    touches: { A: r }
  - id: forget
    name: "Forget (on request)"
    body: "If a deletion request arrives, run unlearning across every store."
    touches: { E: w, K: w, G: w, V: w, P: w }
    optional: true
  - id: answer
    name: "Answer"
    body: "Answer the query from the updated state, citing provenance."
    touches: { E: r, K: r, G: r, V: r, P: r, A: r }

operators:
  - symbol: "𝒞_sch"
    name: "Schema consolidation"
  - symbol: "𝒮_sup"
    name: "Temporal supersession"
  - symbol: "𝒰_unl"
    name: "Deterministic unlearning"

consolidation_objective:
  equation: "max_α  𝒥(α) − λ·ℛ(α)"
  body: "Consolidation trades expected future utility 𝒥 against storage or retrieval cost ℛ."

# Temporal supersession resolves a conflict with one of five outcomes. The
# paper defines supersede and scope-coexist; the other three are named only,
# so their descriptions here are our reading and are flagged on screen.
reconciliation:
  - id: support
    name: "Support"
    defined: false
    body: "New evidence agrees with the stored claim and corroborates it."
  - id: supersede
    name: "Supersede"
    defined: true
    body: "The earlier claim's validity interval is closed at the effective time; the new evidence is authoritative from then on."
  - id: scope-coexist
    name: "Scope-coexist"
    defined: true
    body: "Claims with different populations or authority both stand, e.g. a preliminary statement next to its audited version."
  - id: retain-conflict
    name: "Retain conflict"
    defined: false
    body: "The contradiction cannot be resolved yet, so both claims are kept and marked as conflicting."
  - id: escalate
    name: "Escalate for review"
    defined: false
    body: "The conflict is handed to a person before the state changes."

degenerate_regimes:
  - name: "Zero-state"
    body: "Nothing persists; every document is processed cold."
  - name: "Monotonic append-only"
    body: "Everything is kept and nothing is reconciled or forgotten."
  - name: "Unstructured summarization"
    body: "Experience is compressed into free text, losing structure and provenance."

# Eq. 2: the conjunctive target 𝒞*: all six properties are required jointly.
target:
  symbol: "𝒞*"
  properties:
    - "Multimodal evidence"
    - "Document structure"
    - "Persistence"
    - "Temporal validity"
    - "Provenance"
    - "Governance"

# Theorem III.4 and Corollary III.7.
theorem:
  id: "Theorem III.4"
  assumption: "step independence"
  equation: "P_cont(k) = 1 − (1 − p_e · p_c)^k"
  harm: "E[MH(k)] = w_m · P_cont(k) · D_KL(P_true ‖ P_false)"
  variables:
    - { symbol: "p_e", name: "observation error rate" }
    - { symbol: "p_c", name: "gate false-accept rate" }
    - { symbol: "k", name: "number of state updates (sessions)" }
    - { symbol: "δ", name: "tolerated contamination probability" }
  corollary:
    id: "Corollary III.7"
    points:
      - "A perfect gate (p_c = 0) gives zero contamination."
      - "For any p_c > 0, contamination approaches 1 as k grows: the gate controls the rate, not the asymptote."
    horizon: "k ≤ ln(1 − δ) / ln(1 − p_e · p_c)"
  conjecture: "Conjecture III.8: schema repair suffices for zero leakage under three stated conditions, which the authors note do not generally hold."

