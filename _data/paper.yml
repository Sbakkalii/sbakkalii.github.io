# Fig. 4 and Section IV: the longitudinal harness.
harness:
  properties:
    - "Sequential presentation"
    - "Cross-document dependency"
    - "Evolving content"
    - "Consolidation opportunities"
    - "Forgetting requirements"
    - "Provenance queries"
    - "Session boundaries"
    - "Abstention"
  arms:
    - id: warm
      symbol: "S_k"
      name: "Warm state"
      body: "Carries consolidated state from documents D_1 … D_k."
    - id: retrieval
      symbol: "R_k"
      name: "Retrieval-only"
      body: "An append-only index of the same documents, with no consolidation."
    - id: cold
      symbol: "S_0 = ∅"
      name: "Cold baseline"
      body: "Starts from empty state on every task."
  metrics:
    - id: eg
      abbr: "EG"
      name: "Experience Gain"
      equation: "EG(k) = Q(D_k+1 | S_k) − Q(D_k+1 | R_k)"
      measures: "Benefit of consolidation beyond retrieval access."
      good: "positive"
    - id: ce
      abbr: "CE"
      name: "Cost Efficiency"
      equation: "CE(k) = 1 − C(D_k+1 | S_k) / C(D_k+1 | S_0)"
      measures: "Inference cost saved by warm state, in tokens or FLOPs."
      good: "positive"
    - id: mh
      abbr: "MH"
      name: "Memory Harm"
      equation: "MH(k) = Q(D_k+1 | S_k^clean) − Q(D_k+1 | S_k)"
      measures: "Degradation induced by state; positive values mean memory hurt."
      good: "bounded"
    - id: ff
      abbr: "FF"
      name: "Forgetting Fidelity"
      equation: "FF = 1 − Leak(X_del | S′_t) / Leak(X_del | S_t)"
      measures: "How much of a deleted target still leaks from the post-deletion state (probe-based mutual-information bound)."
      good: "high"
    - id: cr
      abbr: "CR"
      name: "Coverage Retention"
      equation: "CR = exp( Q(Y_ret | S′_t) − Q(Y_ret | S_t) )"
      measures: "Whether knowledge that should survive a deletion still does."
      good: "high"
  cumulative_ce: "CE_cum(k) = 1 − Σ warm costs / Σ cold costs over sessions 1 … k+1. A memory system pays for itself when CE_cum(k) > 0 for the target stream length, even if per-task CE is zero in some sessions."
  memory_harm_protocol: "Run a clean stream and a corrupted one over the same documents; the corrupted stream replaces a fraction ρ_c of observations with plausible but wrong values, such as a misread tax ID or a transposed table cell."
  statistics: "A mixed-effects model with a log-exposure term f(k) = log(1 + k), a warm–cold indicator, family-level random intercepts and slopes, and AR(1) residuals; a paired bootstrap over streams for small samples."
  success: "Positive Experience Gain and Cost Efficiency, bounded Memory Harm, and high Forgetting Fidelity and Coverage Retention, under all eight mandatory properties."

# Fig. 6 and Algorithm 2: verifiable forgetting.
unlearning:
  levels:
    - level: 1
      name: "Physical object removal"
      body: "Delete the raw file."
      status: "implemented"
      metric: "FF · CR"
    - level: 2
      name: "Representation invalidation"
      body: "Remove embeddings and graph nodes derived from it."
      status: "implemented"
      metric: "FF · CR"
    - level: 3
      name: "Consolidated schema repair"
      body: "Re-consolidate schemas that depended on the deleted evidence and repair links."
      status: "unbuilt"
      metric: "FF · CR"
    - level: 4
      name: "Parametric unlearning"
      body: "Remove facts absorbed into model weights: exact retraining, influence-based approximation, certified residual checks."
      status: "unbuilt"
      metric: "Additional certification"
    - level: 5
      name: "Certified non-recoverability"
      body: "Audit residual leakage cryptographically or statistically, then issue a certificate."
      status: "unbuilt"
      metric: "Additional certification"
  note: "Passing one level does not imply success at the next. Current Document AI implements Levels 1–2; skipping Level 3 leaves non-zero leakage in the semantic store."

provenance_chain:
  equation: "σ₂ ↝ σ₁ ↝ {e₁, e₂, e₃} ↝ {D_i, ℓ_i, v_i}"
  body: "Schemas abstract over evidence without cutting the chain back to the document, location and version. A system that cannot cite the exact table cell and footnote behind a claim cannot be deployed in an audit."

bitemporal:
  times: ["Publication time", "Event time", "Effective time", "Ingestion time"]

enterprise:
  domains:
    - { name: "Legal discovery", body: "Millions of documents and non-monotonic amendments." }
    - { name: "Healthcare", body: "Longitudinal patient models." }
    - { name: "Financial auditing", body: "Unbroken provenance chains." }
    - { name: "Scientific literature", body: "Synthesis over superseded findings." }
  constraints:
    - "Throughput and efficiency at scale"
    - "Consistency, availability and cost trade-offs"
    - "Multi-tenant isolation"
    - "Permission-aware governance within a single document"
    - "Security against persistent poisoning"
    - "Retention and data-residency rules for remembered information"

agenda:
  - title: "Provenance-preserving consolidation"
    body: "Abstract visual observations into schemas without losing links to source bounding boxes."
  - title: "Adaptive evidence acquisition"
    body: "Stop inspecting pages when the expected information gain falls below the compute cost."
  - title: "Memory-conditioned top-down parsing"
    body: "Show that warm-state parsers speed up layout detection on recurring document families."
  - title: "Bitemporal state and non-monotonic supersession"
    body: "Model publication, event, effective and ingestion time without losing audit trails."
  - title: "Certified machine unlearning"
    body: "Repair knowledge graphs and parametric priors after erasure requests."
  - title: "Policy-aware governed memory"
    body: "Embed multi-tenant access control in late-interaction retrieval and in the state itself."

limitations:
  - "The survey leans towards English, Latin-script, modern documents; low-resource languages and historical manuscripts are under-represented."
  - "Cognitive science motivates hypotheses, not optimal design; the cortical-consolidation mapping is an analogy."
  - "The state tuple, lifecycle and harness are formal specifications, not validated implementations."
  - "Obtaining genuinely novel document streams, absent from training data, is the main benchmark limitation."

