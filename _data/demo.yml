# The decision-ledger research prototype (ledger-demo, after "Fresh at Decision, Stale at Action").
ledger:
  decision:
    title: "Ship the December campaign by express pallet with Halden Freight"
    chosen: "Halden Freight, express"
    alternatives: ["Halden Freight, standard", "Second carrier, express"]
    evidence: "MSA §5: express pallet €68.00 (verified 2026-10-01)."
    dossier: ["Halden Freight SAS", "Halden’s December express route runs through the port of Le Havre", "Orvelle Analytics SA"]
    watch: ["Halden Freight express rate or capacity changes", "Disruption on the Le Havre route", "Orvelle December volume forecast changes"]
    times:
      - { key: t_w, label: "Evidence written", date: "2026-03-02" }
      - { key: t_v, label: "Evidence verified", date: "2026-10-01" }
      - { key: t_d, label: "Decision made", date: "2026-10-05" }
      - { key: t_r, label: "Revision deadline", date: "2026-11-20" }
      - { key: t_a, label: "Action", date: "2026-12-01" }
      - { key: t_e, label: "Outcome observed", date: "2026-12-15" }
  news:
    - { id: n1, date: "2026-10-15", text: "Amendment No. 1: Halden Freight’s express pallet rate becomes €71.50 from 1 November.", names: true, dossier: true, watch: true, decisive: false, effect: "Cost rises by €3.50 per pallet; the decision can stand." }
    - { id: n2, date: "2026-10-22", text: "Halden Marine announces a fleet maintenance stop in December.", names: true, dossier: false, watch: false, decisive: false, decoy: true, effect: "A different company with a similar name." }
    - { id: n3, date: "2026-11-09", text: "Dock workers at the port of Le Havre call a strike from 25 November to 3 December.", names: false, dossier: true, watch: true, decisive: true, effect: "The December express route is blocked: switch to the second carrier before 20 November." }
    - { id: n4, date: "2026-11-12", text: "A strike at the port of Le Havre is planned for 15–20 January 2027.", names: false, dossier: true, watch: true, decisive: false, after_activity: true, effect: "Starts after the activity ends: dropped by the time filter." }
    - { id: n5, date: "2026-11-25", text: "Orvelle raises its December volume forecast by 10%.", names: true, dossier: true, watch: true, decisive: false, late: true, effect: "Arrives after the revision deadline: too late to change this decision." }
