# SynaptYon products: the whole Document Intelligence chain, from ingestion
# to downstream applications, plus the persistent-memory layer specified in
# "Amnesia by Design, Memory By Necessity" (Bakkali & Merimi,
# arXiv:2609.32041). The same file drives the SynaptYon site
# (github.com/Sbakkalii/synaptyon, _data/products.yml); keep the two copies
# identical.
#
# Nothing here is generally available, so the file claims no customers,
# benchmarks or prices. Research results are quoted only from the papers
# they come from. `spec` cites the section of the paper a memory product
# implements. Product names are working names and still need a trademark
# check.

statuses:
  development: { label: "In development", tone: "accent" }
  soon:        { label: "Coming soon", tone: "muted" }
  spec:        { label: "Specification published", tone: "ok" }
  research:    { label: "Published research", tone: "ok" }

paper:
  title: "Amnesia by Design, Memory By Necessity: Persistent State for Document Intelligence"
  arxiv: "2609.32041"
  url: "https://arxiv.org/abs/2609.32041"
  pdf: "https://arxiv.org/pdf/2609.32041"

# The chain, in five stages. Every product belongs to exactly one stage.
chain:
  - id: ingest
    name: "Ingest"
    verb: "Capture, read and structure every page"
    products: [agora, grammata, morphe]
  - id: understand
    name: "Understand"
    verb: "Classify, extract and verify"
    products: [taxis, kleis, onoma, pistis]
  - id: apply
    name: "Apply"
    verb: "Answer, search, summarise and translate"
    products: [sibyl, heuresis, epitome, hermeneus]
  - id: remember
    name: "Remember"
    verb: "Keep what was read, with provenance"
    products: [mnemos, argus, chronos, ariadne, lethe]
  - id: measure
    name: "Measure"
    verb: "Prove it works on your documents"
    products: [anamnesis]

# Document families the chain is built for, with the products each one uses.
solutions:
  - id: business
    name: "Business documents"
    kicker: "Business // Operations"
    examples: "Invoices, purchase orders, delivery notes, contracts, forms, correspondence"
    points:
      - "Classify and split mixed batches the moment they arrive."
      - "Extract every field with the box it came from."
      - "Catch the amendment that changes last quarter's terms."
    products: [agora, taxis, kleis, chronos, ariadne]
  - id: financial
    name: "Financial documents"
    kicker: "Finance // Audit"
    examples: "Bank statements, annual reports and filings, receipts, audit evidence, tax forms"
    points:
      - "Read tables cell by cell, footnotes included."
      - "Trace a consolidated figure back to the receipts behind it."
      - "Keep a preliminary statement and its audited version apart."
    products: [morphe, kleis, pistis, ariadne, chronos]
  - id: historical
    name: "Historical documents"
    kicker: "Archives // Heritage"
    examples: "Manuscripts, civil and parish registers, printed heritage, low-resource scripts"
    points:
      - "Handwritten and printed text, including scripts most OCR skips."
      - "Layouts that were never designed for machines."
      - "Names, places and dates linked across thousands of pages."
      - "Search a whole collection by meaning, not only by keyword."
    products: [grammata, morphe, onoma, heuresis, hermeneus]
  - id: healthcare
    name: "Healthcare documents"
    kicker: "Health // Clinical"
    examples: "Prescriptions, lab reports, discharge letters, referrals"
    points:
      - "Handwritten prescriptions, in more than one language."
      - "A new report read against the patient's history."
      - "Translation that keeps the medical terminology right."
      - "Disposal that reaches every record derived from the source."
    products: [grammata, kleis, chronos, hermeneus, lethe]
  - id: identity
    name: "Identity & onboarding"
    kicker: "KYC // Onboarding"
    examples: "Identity cards, passports, proof of address, onboarding forms"
    points:
      - "Reject unusable captures before anyone reviews them."
      - "Locate the photo and the fields on camera-captured documents."
      - "Delete onboarding data when retention ends, and prove it."
    products: [agora, pistis, kleis, lethe]
  - id: legal
    name: "Legal & compliance"
    kicker: "Legal // Compliance"
    examples: "Contracts and amendments, policies, regulatory filings, case files"
    points:
      - "Know which clause is in force on any date."
      - "Answers that quote the clause, not a paraphrase."
      - "Matters, clients and teams kept strictly apart."
    products: [chronos, sibyl, ariadne, mnemos]

# The research view of the memory layer (the founder's site): the lifecycle
# of Fig. 3 plus evaluation, each layer owned by one product.
stack:
  - id: acquire
    name: "Acquire"
    verb: "Read the whole document"
    body: "Extract the multimodal observation: text, layout coordinates, table structure and visual elements, for questions not yet asked."
    paper: "Observe · D_t = (V, T, B, G, H, M)"
    product: mnemos
    research: [2025-globaldoc, 2023-vlcdoc, 2021-eaml, 2024-multimodal-adaptive-inference, 2025-wildkhmerst, 2026-bhcp-doc]
  - id: validate
    name: "Validate"
    verb: "Gate before writing"
    body: "Corroborate each observation against the provenance ledger and reject it when confidence is below threshold, leaving state unchanged."
    paper: "Pre-write gate · Theorem III.4"
    product: argus
    research: [2026-amnesia-by-design]
  - id: consolidate
    name: "Consolidate"
    verb: "Write and abstract"
    body: "Append admitted evidence with its timestamp and provenance, then abstract recurring families into reusable schemas."
    paper: "E_t, K_t, Γ_t · max J(α) − λR(α)"
    product: mnemos
    research: [2026-amnesia-by-design]
  - id: reconcile
    name: "Reconcile"
    verb: "Know what is in force"
    body: "Resolve conflicts with one of five outcomes and close superseded claims at their effective time, keeping history for audit."
    paper: "Temporal supersession · 𝒱_t"
    product: chronos
    research: [2026-amnesia-by-design, 2026-fresh-at-decision]
  - id: trace
    name: "Trace"
    verb: "Cite the box"
    body: "Keep the chain from every conclusion back to document, region and version, through consolidation, supersession and repair."
    paper: "Provenance invariant · P_t"
    product: ariadne
    research: [2026-amnesia-by-design, 2025-hybrid-rag]
  - id: forget
    name: "Forget"
    verb: "Erase, and prove it"
    body: "Remove a target across every store, repair the schemas that depended on it, and certify what can no longer be recovered."
    paper: "Five-level unlearning · Algorithm 2"
    product: lethe
    research: [2026-amnesia-by-design]
  - id: measure
    name: "Measure"
    verb: "Show that memory helps"
    body: "Compare warm, retrieval-only and cold arms on the same future documents and report benefit, cost, risk and governability together."
    paper: "Longitudinal harness · five metrics"
    product: anamnesis
    research: [2026-amnesia-by-design]

products:
  # ------------------------------------------------------------- Ingest
  - id: agora
    name: "Agora"
    role: "Ingestion & capture"
    layer: ingest
    status: soon
    tagline: "Every document, one front door."
    pitch: >-
      Agora takes documents in from wherever they arrive (uploads, scanners,
      phone photos, mailboxes and archive batches), checks that each capture
      is usable, splits multi-document files and removes duplicates before
      anything downstream spends compute on them.
    audience: "Operations, back-office and archive teams receiving documents at volume."
    inputs: ["PDF, TIFF, JPEG and PNG", "Phone photos and camera captures", "Email attachments", "Archive batches"]
    outputs: ["Normalised page images", "Capture quality score per page", "Document boundaries in mixed files", "Duplicate flags"]
    doc_types: [business, financial, historical, healthcare, identity, legal]
    capabilities:
      - title: "Usable capture, or a retake"
        body: "Image-quality checks flag blur, glare and poor framing on camera captures before review."
        research: [2025-idtrust, 2019-face-detection-icdarw]
      - title: "Split and deduplicate"
        body: "Mixed scans are cut into documents, and a file already seen is recognised instead of processed twice."
        research: [2025-globaldoc]
      - title: "Compute where it is needed"
        body: "Easy pages leave the pipeline early; hard pages get the full models."
        research: [2024-multimodal-adaptive-inference]
    demo: pipeline
    demo_stage: ingest
    works_with: [grammata, taxis, pistis]

  - id: grammata
    name: "Grammata"
    role: "OCR & handwriting recognition"
    layer: ingest
    status: soon
    tagline: "Print, handwriting, and the scripts others skip."
    pitch: >-
      Grammata reads printed and handwritten text, line by line, with a
      confidence for every word. It is built for the hard cases: handwriting,
      degraded historical pages and low-resource scripts, where generic OCR
      quietly fails.
    audience: "Archives, healthcare and any team whose documents are handwritten, old or not in Latin script."
    inputs: ["Page images from Agora", "Printed, handwritten or mixed pages"]
    outputs: ["Text lines with boxes", "Word-level confidence", "Reading order", "Language and script"]
    doc_types: [historical, healthcare, business, identity]
    capabilities:
      - title: "Handwriting"
        body: "Handwritten text detection and recognition, down to bilingual handwritten clinical prescriptions."
        research: [2026-bhcp-doc]
      - title: "Low-resource scripts"
        body: "Khmer benchmarks for detection, recognition and end-to-end spotting, and cross-lingual transfer to complex scripts."
        research: [2025-wildkhmerst, 2024-khmerst, 2026-khmer-scene-text-spotting, 2025-cross-lingual-khmer]
      - title: "Fonts and typefaces matter"
        body: "Measured across 19 Khmer typefaces: OCR accuracy depends on the font, so models are chosen per collection."
        research: [2025-khmer-font-types, 2024-khmer-text-recognition-sota]
    demo: pipeline
    demo_stage: read
    works_with: [agora, morphe, onoma]

  - id: morphe
    name: "Morphe"
    role: "Layout & table structure"
    layer: ingest
    status: soon
    tagline: "Regions, reading order, every table cell."
    pitch: >-
      Morphe turns a page into structure: titles, paragraphs, tables,
      figures, stamps and signatures, in reading order, with tables rebuilt
      row by row and form fields paired with their labels. Downstream
      products read structure, not a flat string.
    audience: "Finance, audit and archive teams whose meaning lives in tables, forms and page layout."
    inputs: ["Page images", "Text lines from Grammata"]
    outputs: ["Typed regions with boxes", "Reading order", "Table cells by row and column", "Label–value pairs", "Section tree"]
    doc_types: [financial, business, historical, legal]
    capabilities:
      - title: "Structure as a graph"
        body: "Rows, columns, figure–caption links and form–field pairs are kept as relations, not flattened into text."
        research: [2026-hsb-gdl, 2025-gnn-gbdt-fusion]
      - title: "Text, layout and image together"
        body: "Cross-modal representations that rely less on OCR positions alone."
        research: [2025-globaldoc, 2022-thesis]
    demo: pipeline
    demo_stage: layout
    works_with: [grammata, kleis, taxis]

  # --------------------------------------------------------- Understand
  - id: taxis
    name: "Taxis"
    role: "Classification & routing"
    layer: understand
    status: soon
    tagline: "Know what it is before you read it."
    pitch: >-
      Taxis recognises the document type from its text, layout and image
      together, and routes it to the right workflow: invoice to accounts
      payable, amendment to legal, register page to the right series. New
      types are learned from a handful of examples.
    audience: "Mailrooms, shared services and archives sorting thousands of documents a day."
    inputs: ["Pages from Agora", "Text and layout from Grammata and Morphe"]
    outputs: ["Document type with confidence", "Routing decision", "Low-confidence queue for review"]
    doc_types: [business, financial, historical, healthcare, identity, legal]
    capabilities:
      - title: "Multimodal classification"
        body: "Image and text learned together: ensemble self-attention, vision-language contrastive pre-training and cross-modal fusion."
        research: [2021-eaml, 2023-vlcdoc, 2020-cross-modal-deep-networks, 2020-visual-textual-fusion]
      - title: "New types from few examples"
        body: "Few-shot document image classification for document types that have no training set yet."
        research: [2025-globaldoc, 2023-transferdoc]
      - title: "Fast on easy pages"
        body: "Multimodal early exits cut latency by over 20% while fully retaining baseline accuracy, in our ICDAR 2024 study."
        research: [2024-multimodal-adaptive-inference]
    demo: pipeline
    demo_stage: classify
    works_with: [agora, kleis, mnemos]

  - id: kleis
    name: "Kleis"
    role: "Key information extraction"
    layer: understand
    status: soon
    tagline: "The fields you need, with the box they came from."
    pitch: >-
      Kleis pulls the fields a workflow needs (supplier, totals, dates,
      account numbers, dosages, parties) into typed, normalised values. Every
      value carries a confidence and the exact region it was read from, so a
      reviewer checks the source in one click.
    audience: "Accounts payable, onboarding, claims and clinical administration."
    inputs: ["Structured pages from Morphe", "Document type from Taxis"]
    outputs: ["Typed fields (dates, amounts, identifiers)", "Normalised values", "Confidence per field", "Source box per field"]
    doc_types: [business, financial, healthcare, identity]
    capabilities:
      - title: "Typed and normalised"
        body: "Dates, amounts, currencies and identifiers come out in one format, whatever the layout they came from."
        research: [2022-thesis]
      - title: "Every value cites its box"
        body: "Provenance from field to region and version, so extraction can be audited."
        research: [2026-amnesia-by-design]
      - title: "Templates learned, not configured"
        body: "Recurring supplier and form layouts become schemas in memory, so the next one is read against them."
        research: [2026-amnesia-by-design]
    demo: pipeline
    demo_stage: extract
    works_with: [morphe, onoma, ariadne, mnemos]

  - id: onoma
    name: "Onoma"
    role: "Named entities & linking"
    layer: understand
    status: soon
    tagline: "Who, what, where and when, across documents."
    pitch: >-
      Onoma finds people, organisations, places, dates, amounts and domain
      entities such as drugs or contract parties, and links each mention to
      the same entity across every document it appears in, building a graph
      your other systems can query.
    audience: "Archives, legal, compliance and research teams connecting information across collections."
    inputs: ["Text and structure from Grammata and Morphe"]
    outputs: ["Entity spans with types", "Entity IDs linked across documents", "Relations between entities"]
    doc_types: [historical, legal, healthcare, financial]
    capabilities:
      - title: "Entities in context"
        body: "Entity extraction tuned per domain; our MTRACE study ablates its effect on downstream retrieval."
        research: [2025-hybrid-rag]
      - title: "A graph, not a list"
        body: "Mentions are linked into a relation graph that persists across sessions and can be rendered back into text."
        research: [2026-amnesia-by-design, 2026-kg-to-text-llm-study]
    demo: pipeline
    demo_stage: entities
    works_with: [kleis, heuresis, mnemos]

  - id: pistis
    name: "Pistis"
    role: "Document trust & consistency"
    layer: understand
    status: soon
    tagline: "Is this document what it claims to be?"
    pitch: >-
      Pistis checks capture quality, the presence of the elements a document
      type requires (photo, signature, stamp), and internal consistency: do
      the line items add up to the total, does the closing balance follow
      from the transactions. Failures go to review with the reason attached.
    audience: "Onboarding, finance and claims teams who must trust a document before acting on it."
    inputs: ["Pages, structure and fields from earlier stages"]
    outputs: ["Quality verdict", "Required-element checks", "Arithmetic and cross-field consistency checks", "Reasons for review"]
    doc_types: [identity, financial, business, healthcare]
    capabilities:
      - title: "Identity document quality"
        body: "Deep quality detection for identity document images, with bandpass filtering."
        research: [2025-idtrust]
      - title: "Faces on camera-captured IDs"
        body: "Face detection evaluated on camera-captured identity documents under complex backgrounds, lighting and defocus."
        research: [2019-face-detection-icdarw]
      - title: "Numbers that add up"
        body: "Totals, balances and cross-field rules checked on the extracted values, each check pointing to its boxes."
        research: [2026-amnesia-by-design]
    demo: pipeline
    demo_stage: verify
    works_with: [agora, kleis, argus]

  # -------------------------------------------------------------- Apply
  - id: sibyl
    name: "Sibyl"
    role: "Question answering & DocVQA"
    layer: apply
    status: soon
    tagline: "Ask the document. Get the cell."
    pitch: >-
      Sibyl answers questions about a page, a file or a whole collection,
      including questions about tables and layout. Every answer cites the
      span, box or cell it relies on, and when the documents do not support
      an answer, Sibyl says so instead of guessing.
    audience: "Analysts, auditors, lawyers and case handlers who need answers they can check."
    inputs: ["A question in French or English", "Documents, or the state kept by Mnemos"]
    outputs: ["Answer", "Cited span, box or cell", "Explicit abstention when unsupported"]
    doc_types: [legal, financial, business, healthcare, historical]
    capabilities:
      - title: "Grounded, or silent"
        body: "Generation may use only retrieved evidence and must abstain when it is insufficient."
        research: [2025-hybrid-rag]
      - title: "Questions about the page"
        body: "Visual question answering over layout, tables and figures, answered with the region highlighted."
        research: [2022-thesis]
      - title: "Answers for a date"
        body: "Reading from Chronos, Sibyl answers with the clause valid today, or on the day you ask about."
        research: [2026-amnesia-by-design]
    demo: pipeline
    demo_stage: ask
    works_with: [heuresis, ariadne, chronos]

  - id: heuresis
    name: "Heuresis"
    role: "Search & retrieval"
    layer: apply
    status: soon
    tagline: "Find it by meaning, by language or by look."
    pitch: >-
      Heuresis searches collections by meaning rather than exact words,
      across phrasings and languages, and finds pages by what they look like:
      the same form, the same stamp, the same layout. Results come with the
      passage and page that matched.
    audience: "Archives, legal discovery and knowledge teams searching large document collections."
    inputs: ["Queries in natural language", "Example pages for visual search"]
    outputs: ["Ranked passages and pages", "Matched region", "Query expansions used"]
    doc_types: [historical, legal, business, financial]
    capabilities:
      - title: "Robust to rephrasing"
        body: "Semantic query expansion with reciprocal rank fusion, evaluated on French and English."
        research: [2025-hybrid-rag]
      - title: "Search by image"
        body: "Content-based document image retrieval with cross-modal representations."
        research: [2025-globaldoc]
      - title: "Query spotting"
        body: "Locating a query structure inside larger graphs, benchmarked on heterogeneous subgraphs."
        research: [2026-hsb-gdl]
    demo: search-demo
    works_with: [sibyl, onoma, mnemos]

  - id: epitome
    name: "Epitome"
    role: "Summarisation"
    layer: apply
    status: soon
    tagline: "The page that replaces the file."
    pitch: >-
      Epitome writes short, faithful summaries of long and administrative
      documents, robust to OCR errors and domain vocabulary, and links each
      sentence back to the passages it summarises.
    audience: "Case handlers, managers and reviewers who need the gist before the detail."
    inputs: ["Documents or document sets", "Optional focus question"]
    outputs: ["Summary", "Source passages per sentence"]
    doc_types: [business, legal, healthcare, historical]
    capabilities:
      - title: "Domain-adapted summaries"
        body: "Pre-training on OCR-transcribed administrative text and fine-tuning with question–answer pairs, for terminology, OCR noise and scarce labels."
        research: [2025-docsum]
      - title: "Summaries that cite"
        body: "Each sentence points to its sources, so a summary can be checked rather than trusted."
        research: [2026-amnesia-by-design]
    demo: pipeline
    demo_stage: summarise
    works_with: [sibyl, ariadne]

  - id: hermeneus
    name: "Hermeneus"
    role: "Domain translation"
    layer: apply
    status: soon
    tagline: "Translation that keeps the terminology right."
    pitch: >-
      Hermeneus translates documents with the vocabulary of their domain,
      retrieving in-domain terminology as it goes, with compact models that
      can run close to the data.
    audience: "Healthcare, research and cross-border teams working between French and English."
    inputs: ["Text and structure from earlier stages", "Terminology databases"]
    outputs: ["Translated text aligned to the source regions", "Terms used, with their source"]
    doc_types: [healthcare, historical, legal]
    capabilities:
      - title: "Terminology-aware"
        body: "Knowledge distillation combined with retrieval of in-domain terminology, for few-shot French-to-English biomedical translation."
        research: [2026-terminology-aware-rakd-nmt]
      - title: "Small enough to deploy"
        body: "Distillation and quantisation for compact biomedical translation models, with lower training cost and footprint."
        research: [2026-model-compression-nmt-biomed, 2025-confidence-based-kd]
    demo: pipeline
    demo_stage: translate
    works_with: [grammata, epitome]

  # ----------------------------------------------------------- Remember
  - id: mnemos
    name: "Mnemos"
    role: "Document memory"
    layer: remember
    inputs: ["Validated fields, entities and structure from every stage"]
    outputs: ["Persistent, queryable document state", "Schemas learned from recurring families", "Answers conditioned on everything read before"]
    doc_types: [business, financial, legal, healthcare, historical]
    status: development
    lead: true
    tagline: "Documents, remembered."
    pitch: >-
      Mnemos keeps what your Document AI reads. Every validated observation
      is written into six linked stores (evidence, schemas, relations,
      validity, provenance and policy), so the next contract, invoice or
      report is read against everything that came before it.
    problem: >-
      Today's systems can parse a 200-page filing and ground an answer to a
      single table cell, then reset. The system that reads the
      ten-thousandth invoice is, computationally, the one that read the
      first.
    equation: "S_t = (E_t, K_t, Γ_t, 𝒱_t, P_t, A_t)"
    audience: "Teams with recurring document streams: contracts and amendments, supplier invoices, clinical reports, research literature."
    layers: [acquire, consolidate]
    state: [E, K, G, V, P, A]
    how:
      - title: "Read everything once"
        body: "Each document becomes a tuple of pixels, tokens, boxes, structure graphs, parse trees and metadata. The observation is document-conditioned, not query-conditioned, so it serves questions nobody has asked yet."
      - title: "Write with provenance"
        body: "Evidence that passes the gate is appended to the episodic store with a timestamp and a link back to its source region."
      - title: "Consolidate what recurs"
        body: "Repeated document families become schemas, chosen by expected future utility minus storage cost. Common queries use the schema; tail queries still reach the episodic detail."
      - title: "Answer from state"
        body: "Queries are answered from the updated state, so reading the first document changes how the second is understood."
    capabilities:
      - title: "Six stores, one state"
        body: "Episodic evidence, consolidated schemas, an associative relation graph, a temporal validity index, a provenance ledger and an authorization state, updated together by one transition per session."
        research: [2026-amnesia-by-design]
      - title: "Schemas that pay for themselves"
        body: "Recurring families shift processing from instance-level perception to schema-conditioned parsing; the target is a positive cumulative cost ratio over the stream, not a faster single document."
        research: [2026-amnesia-by-design, 2024-multimodal-adaptive-inference]
      - title: "Multimodal reading"
        body: "Cross-modal vision-language representations for classification, extraction and retrieval of document images, including low-resource scripts."
        research: [2025-globaldoc, 2023-vlcdoc, 2021-eaml, 2025-wildkhmerst]
      - title: "Hybrid by design"
        body: "No single substrate offers persistence, inspection, relations, generalization, deletion and box-level grounding together, so the state is a composition."
        research: [2026-amnesia-by-design]
    spec:
      - { ref: "§III-A", what: "Document tuple and state tuple, Eq. (3)–(4)" }
      - { ref: "§III-B", what: "Per-session state transition, Algorithm 1" }
      - { ref: "§III-C", what: "Architecture and degenerate regimes, Fig. 3" }
      - { ref: "§III-E", what: "Substrate composition, Table III" }
    metrics: [eg, ce]
    demo: lifecycle
    works_with: [kleis, argus, chronos, ariadne, lethe]

  - id: argus
    name: "Argus"
    role: "Validation gate"
    layer: remember
    inputs: ["Candidate fields and entities, with confidence"]
    outputs: ["Admitted evidence", "Rejected writes, with the reason", "Measured false-accept rate"]
    doc_types: [business, financial, healthcare, identity]
    status: soon
    tagline: "Nothing enters memory unverified."
    pitch: >-
      A memory that stores its own mistakes gets worse with use. Argus sits
      between reading and remembering: every observation is corroborated
      against the provenance ledger and scored for confidence, and anything
      below threshold is rejected with the state left exactly as it was.
    problem: >-
      Writing a model's output straight into memory turns one misread tax ID
      or transposed table cell into a durable error that every later session
      inherits. Unvalidated writes drive contamination towards certainty.
    equation: "P_cont(k) = 1 − (1 − p_e · p_c)^k"
    audience: "Anyone who lets a model write to a store that other sessions read."
    layers: [validate]
    state: [E, P]
    how:
      - title: "Corroborate"
        body: "Retrieve supporting or contradicting evidence for the new observation from the prior provenance ledger."
      - title: "Score confidence"
        body: "Compute epistemic confidence as the calibrated complement of predictive entropy over the extracted fields."
      - title: "Admit or reject"
        body: "Below the confidence threshold nothing is written; the session still answers, but the state is unchanged."
      - title: "Measure the gate"
        body: "Estimate the false-accept rate by injecting controlled corruption into a parallel stream, then read off the safe horizon."
    capabilities:
      - title: "A bound you can plan with"
        body: "From the observation error rate and the gate's false-accept rate, the paper derives how many sessions the state can absorb before contamination exceeds a tolerated level δ."
        research: [2026-amnesia-by-design]
      - title: "Rate, not asymptote"
        body: "A perfect gate gives zero contamination; any imperfect gate only slows it, so the bound tells you when to re-verify, not that you never have to."
        research: [2026-amnesia-by-design]
      - title: "Memory Harm, measured"
        body: "Run a clean and a corrupted stream over the same documents and report the quality gap at each evaluation point."
        research: [2026-amnesia-by-design]
    spec:
      - { ref: "§III-B", what: "Observe, corroborate, validate, Eq. (5)–(8)" }
      - { ref: "§III-D", what: "Theorem III.4 and Corollary III.7" }
      - { ref: "§IV-D", what: "Controlled corruption for Memory Harm" }
      - { ref: "§V-A", what: "Memory contamination, Fig. 5a" }
    metrics: [mh]
    demo: contamination
    works_with: [mnemos, ariadne]

  - id: chronos
    name: "Chronos"
    role: "Versions & amendments"
    layer: remember
    inputs: ["New claims from incoming documents"]
    outputs: ["Validity interval for every claim", "Reconciliation outcome", "Full version history"]
    doc_types: [legal, business, financial, healthcare]
    status: soon
    tagline: "Knows which clause is in force today."
    pitch: >-
      Documents revise one another. Chronos records, for every stored claim,
      the interval during which it is authoritative, and resolves each new
      conflict into one of five outcomes instead of overwriting: support,
      supersede, scope-coexist, retain conflict, or escalate for review.
    problem: >-
      An amendment supersedes a clause only after its effective date. A
      preliminary statement coexists with its audited version because the
      two carry different authority. Overwrite-on-conflict loses both
      distinctions, and the audit trail with them.
    equation: "D_1 valid [t_a, t_c) · D_2 valid [t_c, t_e)"
    audience: "Contract, compliance and audit work where documents amend, restate and contradict each other."
    layers: [reconcile]
    state: [V, K, P]
    how:
      - title: "Keep four clocks"
        body: "Publication, event, effective and ingestion time are distinct axes; an amendment ingested today may take effect next quarter."
      - title: "Classify the conflict"
        body: "Each new claim is reconciled against the store into one of five outcomes, and the outcome itself is recorded."
      - title: "Close, don't delete"
        body: "Under supersede, the earlier claim's interval is closed at the effective time and kept for audit."
      - title: "Answer for a date"
        body: "Ask what holds today, or what held on the day a decision was taken, and get the clause that was valid then."
    capabilities:
      - title: "Five outcomes"
        body: "Supersede and scope-coexist are defined in the paper; support, retain conflict and escalate for review are named there, and our product reading of them is labelled as such."
        research: [2026-amnesia-by-design]
      - title: "History kept for audit"
        body: "Superseded claims stay queryable with their closed validity interval, so the system can show what changed and when."
        research: [2026-amnesia-by-design]
      - title: "Fresh at action time"
        body: "A decision taken on one version of the facts is routed the news that changes it before its revision deadline."
        research: [2026-fresh-at-decision]
    spec:
      - { ref: "§III-B", what: "Temporal supersession operator 𝒮_sup" }
      - { ref: "§III-C", what: "Temporal layer 𝒱_t" }
      - { ref: "§V-B", what: "Bitemporal supersession, Fig. 5b" }
    metrics: [eg, mh]
    demo: reconcile
    works_with: [mnemos, ariadne]

  - id: ariadne
    name: "Ariadne"
    role: "Provenance & citations"
    layer: remember
    inputs: ["Every write, consolidation and repair"]
    outputs: ["Citation from any answer to document, region and version", "Audit trail through schemas"]
    doc_types: [financial, legal, business, healthcare]
    status: soon
    tagline: "Every answer, traced to the bounding box."
    pitch: >-
      Ariadne keeps the thread from any conclusion, however consolidated,
      back to the document, region and version it came from. Provenance is
      not an extra step; it is an invariant that every operation preserves,
      through consolidation, supersession and repair.
    problem: >-
      Assistant "memory" features retain the fact but discard the evidence.
      They cannot trace a remembered liability cap back to the box on page
      four, so they cannot be used in an audit.
    equation: "σ₂ ↝ σ₁ ↝ {e₁, e₂, e₃} ↝ {D_i, ℓ_i, v_i}"
    audience: "Audit, legal and regulated teams who must show where every number came from."
    layers: [trace]
    state: [P]
    how:
      - title: "Tag at write"
        body: "Every admitted observation carries its document, location and version into the ledger."
      - title: "Survive abstraction"
        body: "When evidence is consolidated into a schema, the schema keeps links to every observation it was built from."
      - title: "Survive change"
        body: "Supersession and forgetting repair the chain instead of cutting it."
      - title: "Cite on answer"
        body: "Answers point to the span, box or table cell they rely on, or abstain when nothing supports them."
    capabilities:
      - title: "Chains through schemas"
        body: "Trace a consolidated claim through the schemas and observations below it, down to source bounding boxes."
        research: [2026-amnesia-by-design]
      - title: "Grounded, or silent"
        body: "Generation may use only retrieved evidence and must abstain when it is insufficient."
        research: [2025-hybrid-rag]
    spec:
      - { ref: "§III-A", what: "Provenance ledger P_t" }
      - { ref: "§III-B", what: "Provenance invariant across operations" }
      - { ref: "§V-B", what: "Recursive provenance" }
      - { ref: "§IV-B", what: "Harness property 6: provenance queries" }
    metrics: []
    demo: doc-inspector
    works_with: [mnemos, chronos, lethe]

  - id: lethe
    name: "Lethe"
    role: "Verifiable deletion"
    layer: remember
    inputs: ["Deletion and retention requests"]
    outputs: ["Deletion across every store", "Repaired schemas", "Audit certificate"]
    doc_types: [identity, healthcare, financial, legal]
    status: soon
    tagline: "Forget on request, and prove it."
    pitch: >-
      Deleting the file is only Level 1. Lethe runs the five-level hierarchy:
      physical removal, representation invalidation, consolidated schema
      repair, parametric unlearning and certified non-recoverability. It
      reports Forgetting Fidelity and Coverage Retention, so a deletion is
      measured rather than assumed.
    problem: >-
      Current Document AI stops at Levels 1 and 2. A schema consolidated from
      a deleted document still carries information about it, so an erasure
      request under GDPR Article 17 is not actually honoured.
    equation: "FF = 1 − Leak(X_del | S′_t) / Leak(X_del | S_t)"
    audience: "Organisations with erasure, retention and data-residency obligations on what their systems remember."
    layers: [forget]
    state: [E, K, G, V, P, A]
    how:
      - title: "Remove the object"
        body: "Purge the raw file, page images and OCR cache."
      - title: "Invalidate representations"
        body: "Delete the embeddings, graph nodes and index entries derived from it."
      - title: "Repair schemas"
        body: "Re-consolidate every schema that depended on the target and repair its provenance links."
      - title: "Certify"
        body: "Bound the residual leakage with membership and attribute-inference probes, and issue a certificate."
    capabilities:
      - title: "Past Level 2"
        body: "Schema repair is where today's systems stop and where leakage remains; it is the core of Lethe."
        research: [2026-amnesia-by-design]
      - title: "Forgetting without collateral"
        body: "Coverage Retention checks that knowledge which should survive the deletion still does."
        research: [2026-amnesia-by-design]
      - title: "Honest about the open part"
        body: "The paper states schema-repair sufficiency as a conjecture with conditions that do not generally hold; Lethe reports which levels a deletion reached."
        research: [2026-amnesia-by-design]
    spec:
      - { ref: "§III-D", what: "Forgetting Fidelity and Coverage Retention, Eq. (13)–(14)" }
      - { ref: "§III-D", what: "Conjecture III.8, schema-repair sufficiency" }
      - { ref: "§V-C", what: "Five-level hierarchy, Fig. 6 and Algorithm 2" }
    metrics: [ff, cr]
    demo: unlearning
    works_with: [mnemos, ariadne]

  - id: anamnesis
    name: "Anamnesis"
    role: "Evaluation harness"
    layer: measure
    inputs: ["Your document stream", "Your system, or ours"]
    outputs: ["Five metrics, reported together", "Statefulness audit"]
    doc_types: [business, financial, legal, healthcare, historical]
    status: spec
    tagline: "Prove that your system remembers."
    pitch: >-
      Leaderboards reward single-shot reading, so nobody builds memory.
      Anamnesis evaluates persistence directly: the same model and the same
      future documents under three arms (warm state, retrieval-only and
      cold), over streams with session breaks, amendments, recurring
      families, deletion requests and unanswerable questions.
    problem: >-
      None of the ten benchmarks audited in the paper tests cross-session
      state evolution. Because benchmarks do not reward persistence,
      researchers do not build it, and the reverse.
    equation: "EG(k) = Q(D_k+1 | S_k) − Q(D_k+1 | R_k)"
    audience: "Research and engineering teams who need to show that a memory system helps, and what it costs."
    layers: [measure]
    state: []
    how:
      - title: "Build the stream"
        body: "Eight mandatory properties, from sequential presentation and cross-document dependency to forgetting requirements and abstention."
      - title: "Run three arms"
        body: "Warm state, an append-only retrieval index over the same stream, and a cold start, under identical weights."
      - title: "Report five metrics"
        body: "Experience Gain, Cost Efficiency, Memory Harm, Forgetting Fidelity and Coverage Retention, always together."
      - title: "Model the dependence"
        body: "A mixed-effects fit with a log-exposure term, family-level random effects and AR(1) residuals, or a paired bootstrap for small samples."
    capabilities:
      - title: "Statefulness audit"
        body: "Code any benchmark, or your own evaluation suite, against the eight criteria of the paper's audit."
        research: [2026-amnesia-by-design]
      - title: "Consolidation, not just access"
        body: "The retrieval-only arm separates what consolidated state adds from what an index already gives."
        research: [2026-amnesia-by-design]
    spec:
      - { ref: "§IV-A", what: "Statefulness audit, Table IV" }
      - { ref: "§IV-B", what: "Harness and its eight properties, Fig. 4" }
      - { ref: "§IV-C", what: "Counterfactual metrics, Eq. (15)–(16)" }
      - { ref: "§IV-D", what: "Statistical design, Eq. (17)–(18)" }
    metrics: [eg, ce, mh, ff, cr]
    demo: harness
    works_with: [mnemos, argus, lethe]

# Earlier and companion publications, shown as "the research behind it":
# what each one taught us and which product uses it.
research:
  - pub: 2025-globaldoc
    name: "GlobalDoc"
    venue: "WACV 2025"
    feeds: mnemos
    body: "A cross-modal transformer for real-world document image retrieval and few-shot classification."
    lesson: "A document's identity lives in the joint vision-language representation, not in either modality alone."
  - pub: 2023-vlcdoc
    name: "VLCDoC"
    venue: "Pattern Recognition 2023"
    feeds: mnemos
    body: "Contrastive vision-language pre-training for cross-modal document classification."
    lesson: "Aligning modalities, rather than merging them, keeps what each one carries."
  - pub: 2024-multimodal-adaptive-inference
    name: "Anytime early exits"
    venue: "ICDAR 2024"
    feeds: mnemos
    body: "The first multimodal early-exit design for document understanding: over 20% lower latency at full baseline accuracy."
    lesson: "Compute can be spent where a document needs it, which is what a memory-warmed parser should do."
  - pub: 2025-hybrid-rag
    name: "MTRACE"
    venue: "arXiv 2025"
    feeds: ariadne
    body: "Multilingual retrieval-augmented generation with strict grounding and explicit abstention, on French and English."
    lesson: "An answer that cannot cite its evidence should not be given."
  - pub: 2026-fresh-at-decision
    name: "Fresh at Decision"
    venue: "arXiv 2026"
    feeds: chronos
    body: "A timestamp theory of LLM decision validity and a decision ledger that routes new information to decisions already made."
    lesson: "Being right when you decide is not being right when you act; validity needs a clock."
  - pub: 2025-wildkhmerst
    name: "WildKhmerST"
    venue: "ICDAR 2025"
    feeds: mnemos
    body: "29,601 annotated Khmer text lines from 10,000 real-world images, with a detection and recognition benchmark."
    lesson: "Most document corpora are English and Latin-script; reading has to work beyond them."

