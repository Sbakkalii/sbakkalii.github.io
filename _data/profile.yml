# One paragraph used on the home page and in structured data.
summary: >-
  I work on Document Intelligence: systems that read visually rich documents,
  ground every answer in evidence on the page, and, as argued in my 2026
  survey, carry what they read forward as persistent, provenance-linked state.
  My research spans cross-modal vision-language document understanding,
  grounded retrieval and question answering, and low-resource scene-text
  recognition.

