# Site configuration for sbakkalii.github.io
#
# Built by GitHub Pages (github-pages gem, Jekyll 3.10, safe mode), so only
# whitelisted plugins work. Restart `jekyll serve` after editing this file.
#
# Facts shown on the site (profile, metrics, products, the paper explorer)
# live in _data/*.yml; publications live in _publications/ (one file each).

locale       : "en-US"
lang         : "en"
title        : "Souhail Bakkali"
name         : "Souhail Bakkali"
tagline      : "Document Intelligence — research and products"
description  : "Souhail Bakkali is a research scientist in Document Intelligence at IRISA, Université de Rennes: multimodal document understanding, grounded retrieval, and persistent evidence-grounded document state."
url          : "https://sbakkalii.github.io"
baseurl      : ""
repository   : "Sbakkalii/sbakkalii.github.io"
timezone     : Europe/Paris
future       : true
og_image     : "/images/og-card.png"

# Kept for compatibility with older includes and external tooling; the site
# itself reads _data/profile.yml.
author:
  name           : "Souhail Bakkali"
  avatar         : "souhail-bakkali.jpg"
  email          : "souhail.bakkali@irisa.fr"
  googlescholar  : "https://scholar.google.com/citations?user=gO_Q48IAAAAJ"
  orcid          : "https://orcid.org/0000-0001-9383-3842"
  github         : "Sbakkalii"
  linkedin       : "souhail-bakkali"

# Markdown
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

# Collections
collections:
  publications:
    output: true
    permalink: /publication/:path/

# Defaults
defaults:
  - scope: { path: "", type: pages }
    values: { layout: page }
  - scope: { path: "", type: publications }
    values: { layout: publication }

# Plugins (all on the GitHub Pages whitelist)
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

# Publications feed at /feed/publications.xml
feed:
  collections:
    - publications

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - graft
  - "*.sublime-project"
  - "*.sublime-workspace"
